<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>作品广场 · 星彩绘图台</title>
<style>
:root{--bg:#090a12;--panel:rgba(21,23,39,.72);--panel2:rgba(255,255,255,.055);--line:rgba(255,255,255,.11);--text:#f4f5ff;--muted:#9da2bf;--faint:#6d7392;--violet:#8c7bff;--cyan:#4edcff;--pink:#ff7bd3;--green:#70e8b3;--radius:22px;font-family:Inter,"Segoe UI","Microsoft YaHei",system-ui,sans-serif}*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100vh;color:var(--text);overflow-x:hidden;background:radial-gradient(900px 600px at 5% -8%,#292452 0,transparent 62%),radial-gradient(750px 550px at 100% 5%,#12364c 0,transparent 63%),radial-gradient(900px 650px at 60% 110%,#321c3d 0,transparent 65%),linear-gradient(165deg,#090a12,#111126 60%,#0a0a13)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.08) 50%,transparent 70%);background-size:260% 260%;animation:sheen 18s linear infinite;z-index:-1}@keyframes sheen{to{background-position:260% 0}}button,input{font:inherit}button{color:inherit}.wrap{width:min(1420px,calc(100% - 40px));margin:auto}.topbar{padding:30px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;gap:13px;align-items:center}.mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--violet),var(--cyan) 55%,var(--pink));box-shadow:0 8px 30px #6758d455}.brand h1{font-size:18px;margin:0;letter-spacing:.12em}.brand p{margin:3px 0 0;color:var(--muted);font-size:11px;letter-spacing:.16em}.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}.hero{padding:35px 0 24px}.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--cyan);margin-bottom:13px}.hero h2{font-size:clamp(32px,5vw,62px);line-height:1.04;letter-spacing:-.045em;margin:0;max-width:760px;background:linear-gradient(110deg,#fff 20%,#c4bcff 55%,#75dfff);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:var(--muted);font-size:15px;margin:16px 0 0;max-width:560px;line-height:1.7}.tools{position:sticky;top:0;z-index:8;margin:8px 0 26px;padding:12px;border:1px solid var(--line);border-radius:17px;background:rgba(11,12,23,.78);backdrop-filter:blur(20px);display:flex;gap:10px;align-items:center;flex-wrap:wrap}.search{flex:1 1 250px;position:relative}.search span{position:absolute;left:13px;top:9px;color:var(--faint)}.search input{width:100%;height:40px;padding:0 14px 0 38px;border-radius:11px;border:1px solid var(--line);background:rgba(0,0,0,.22);color:var(--text);outline:0}.search input:focus{border-color:var(--violet);box-shadow:0 0 0 3px #8c7bff22}.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(255,255,255,.04)}.seg button,.sort{height:32px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;font-size:12px}.seg button.active,.sort.active{background:linear-gradient(120deg,#8c7bff33,#4edcff22);color:#fff}.sort{border:1px solid var(--line);height:40px;padding:0 14px}.sort:hover,.seg button:hover{color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;padding-bottom:25px}.art{min-width:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.025));box-shadow:0 18px 45px #0003;cursor:pointer;animation:rise .5s both;transition:transform .25s,border-color .25s,box-shadow .25s}.art:hover{transform:translateY(-5px);border-color:#a69aff88;box-shadow:0 24px 55px #0006}.thumb{position:relative;aspect-ratio:3/4;background:linear-gradient(135deg,#1b1d36,#121326);overflow:hidden}.thumb img{width:100%;height:100%;display:block;object-fit:cover;opacity:0;transition:opacity .5s,transform .5s}.thumb img.loaded{opacity:1}.art:hover .thumb img{transform:scale(1.04)}.thumb .fallback{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:30px}.badge{position:absolute;left:11px;top:11px;padding:5px 8px;border-radius:7px;background:#090a12b8;border:1px solid #ffffff24;font-size:10px;letter-spacing:.08em}.body{padding:13px 14px 14px}.title{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.by{font-size:11px;color:var(--muted);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tags{display:flex;gap:5px;overflow:hidden;margin-top:11px}.tag{white-space:nowrap;padding:4px 7px;border-radius:6px;background:#ffffff09;color:#aeb4d3;font-size:10px}.meta{display:flex;justify-content:space-between;align-items:center;margin-top:13px;color:var(--faint);font-size:11px}.likes{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:4px 0}.likes:hover,.likes.liked{color:var(--pink)}.likes:disabled{opacity:.55;cursor:wait}.empty,.loading{text-align:center;color:var(--muted);padding:65px 15px;grid-column:1/-1}.empty strong{display:block;color:#fff;font-size:18px;margin-bottom:8px}.retry{display:block;margin:18px auto 0;min-width:110px;height:40px;border-radius:10px;border:1px solid #ffffff22;background:#ffffff09;color:#dce0ff;cursor:pointer}.retry:hover{background:#8c7bff22;border-color:#8c7bff88}.more{display:block;margin:5px auto 58px;min-width:150px;height:44px;border-radius:12px;border:1px solid #ffffff22;background:#ffffff09;cursor:pointer;color:#dce0ff}.more:hover{background:#8c7bff22;border-color:#8c7bff88}.more[hidden]{display:none}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);padding:11px 16px;border:1px solid var(--line);border-radius:10px;background:#1a1b2beF;color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}dialog{width:min(960px,calc(100% - 28px));max-height:calc(100vh - 28px);padding:0;border:1px solid #ffffff22;border-radius:22px;background:#111322f5;color:var(--text);box-shadow:0 30px 100px #000b;overflow:hidden}dialog::backdrop{background:#05050bcc;backdrop-filter:blur(8px)}.detail{display:grid;grid-template-columns:minmax(280px,1fr) minmax(280px,.82fr);max-height:calc(100vh - 28px);overflow:auto}.detail-media{min-height:360px;background:#080910;display:flex;align-items:center;justify-content:center}.detail-media img{max-width:100%;max-height:calc(100vh - 28px);width:100%;height:100%;object-fit:contain}.detail-info{padding:27px 25px 24px}.close{float:right;border:0;background:#ffffff0d;border-radius:9px;width:36px;height:36px;cursor:pointer;font-size:20px}.detail-info h3{font-size:25px;line-height:1.2;margin:4px 50px 8px 0}.detail-by{color:var(--muted);font-size:13px}.detail-section{border-top:1px solid var(--line);margin-top:22px;padding-top:17px}.detail-section h4{font-size:11px;color:var(--cyan);letter-spacing:.14em;margin:0 0 9px}.prompt{font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.65;color:#ccd0ea;white-space:pre-wrap;word-break:break-word;max-height:180px;overflow:auto}.params{display:grid;grid-template-columns:1fr 1fr;gap:9px}.param{padding:9px;border-radius:9px;background:#ffffff06}.param small{display:block;color:var(--faint);font-size:10px;margin-bottom:3px}.param b{font-size:12px;font-weight:500;word-break:break-word}.hidden{color:var(--muted);font-size:12px}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(max-width:650px){.wrap{width:min(100% - 24px,1420px)}.topbar{padding-top:18px}.hero{padding-top:25px}.tools{top:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.art{border-radius:16px}.body{padding:10px}.by{margin-top:5px}.tags{margin-top:8px}.meta{margin-top:9px}.detail{display:block}.detail-media{height:48vh;min-height:240px}.detail-info{padding:18px}.detail-info h3{font-size:21px}}@media(max-width:380px){.grid{grid-template-columns:1fr}.seg{flex:1;justify-content:space-between}.seg button{padding:0 9px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="topbar"><div class="brand"><div class="mark">✦</div><div><h1>星彩绘图台 · SQUARE</h1><p>PUBLIC CREATIONS</p></div></div><div class="status">公共作品广场</div></header>
<section class="hero"><div class="eyebrow">Discover / Share / Inspire</div><h2>每一束灵感，<br>都值得被看见。</h2><p>浏览社区创作者公开发布的作品，发现新的视觉语言与提示词灵感。</p></section>
<div class="tools"><div class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索标题、作者或标签…" autocomplete="off"></div><div class="seg" id="ratings"><button class="active" data-rating="">全部</button><button data-rating="general">全年龄</button><button data-rating="r15">R15</button><button data-rating="r17">R17</button></div><div class="seg"><button class="sort active" id="hot">热门</button><button class="sort" id="new">最新</button></div></div>
<main id="grid" class="grid"><div class="loading">正在调取作品集…</div></main><button class="more" id="more" hidden>加载更多</button>
</div><div class="toast" id="toast"></div>
<dialog id="dialog"><div class="detail"><div class="detail-media"><img id="detailImage" alt=""></div><div class="detail-info"><button class="close" id="close" aria-label="关闭详情">×</button><h3 id="detailTitle"></h3><div class="detail-by" id="detailBy"></div><div class="detail-section"><h4>公开 PROMPT</h4><div id="detailPrompt" class="prompt"></div></div><div class="detail-section"><h4>生成参数</h4><div id="detailParams" class="params"></div></div></div></div></dialog>
<script>
(() => {
  const API='/pub/gallery', visitorKey='ynai-square-visitor';
  let visitor=localStorage.getItem(visitorKey); if(!visitor){visitor=crypto.randomUUID();localStorage.setItem(visitorKey,visitor)}
  const state={search:'',rating:'',sort:'hot',offset:0,limit:24,total:0,loading:false};
  const $=s=>document.querySelector(s), grid=$('#grid'), more=$('#more'), toastEl=$('#toast');
  const labels={general:'全年龄',r15:'R15',r17:'R17'};
  const headers=()=>({'X-YesNAI-Visitor':visitor,Accept:'application/json'});
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>toastEl.classList.remove('show'),2600)}
  function imageUrl(item,thumb=true){const value=thumb?(item.thumbnail_url||item.thumbnailUrl):(item.media_url||item.mediaUrl);return value||`${API}/i/${encodeURIComponent(String(item.public_id||item.id||''))}${thumb?'?t=thumb':''}`}
  function rating(v){return labels[v]||String(v||'未标注').toUpperCase()}
  function tagsOf(value){if(Array.isArray(value))return value;try{const parsed=JSON.parse(value||'[]');return Array.isArray(parsed)?parsed:[]}catch{return String(value||'').split(',').map(x=>x.trim()).filter(Boolean)}}
  function normalize(data){return Array.isArray(data)?{items:data,total:data.length}:data||{items:[],total:0}}
  async function request(url,init={}){const h=new Headers(headers());if(init.headers)new Headers(init.headers).forEach((v,k)=>h.set(k,v));const r=await fetch(url,{...init,headers:h});if(!r.ok){let msg='请求失败（HTTP '+r.status+'）';try{const d=await r.json();msg=d?.error?.message||d?.message||msg}catch{}throw Error(msg)}return r.json()}
  function card(item,i){const rawId=String(item.public_id||item.id||'');const id=esc(rawId);const author=item.author||{};const tags=tagsOf(item.tags);const article=document.createElement('article');article.className='art';article.style.animationDelay=Math.min(i*.035,.4)+'s';article.dataset.id=rawId;article.innerHTML=`<div class="thumb"><div class="fallback">✦</div><img loading="lazy" src="${esc(imageUrl(item))}" alt="${esc(item.title)||'作品'}"><span class="badge">${rating(item.rating)}</span></div><div class="body"><div class="title">${esc(item.title)||'无题作品'}</div><div class="by">by ${esc(author.display_name||author.displayName||author.username||item.author_name||'匿名创作者')}</div><div class="tags">${tags.slice(0,3).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div><div class="meta"><span>◉ ${Number(item.view_count||item.views||0).toLocaleString()}</span><button class="likes ${item.liked?'liked':''}" data-like="${id}" aria-label="点赞">♥ <span>${Number(item.like_count||item.likes||0).toLocaleString()}</span></button></div></div>`;const img=article.querySelector('img');img.addEventListener('load',()=>{img.classList.add('loaded');article.querySelector('.fallback').style.display='none'});img.addEventListener('error',()=>{img.style.display='none'});article.addEventListener('click',e=>{if(!e.target.closest('[data-like]'))openDetail(item)});article.querySelector('[data-like]').addEventListener('click',e=>{e.stopPropagation();like(article,rawId,item)});return article}
  async function load(reset=false){if(state.loading)return;if(reset){state.offset=0;grid.innerHTML=''}state.loading=true;if(!grid.children.length)grid.innerHTML='<div class="loading">正在调取作品集…</div>';try{const q=new URLSearchParams({limit:String(state.limit),offset:String(state.offset),sort:state.sort==='hot'?'likes':'new'});if(state.search)q.set('search',state.search);if(state.rating)q.set('rating',state.rating);const data=normalize(await request(`${API}?${q.toString()}`));if(reset)grid.innerHTML='';if(!data.items.length&&!grid.children.length){grid.innerHTML='<div class="empty"><strong>还没有找到作品</strong>换个关键词试试看。<button class="retry" type="button">重新加载</button></div>';grid.querySelector('.retry').onclick=()=>load(true)}data.items.forEach((x,i)=>grid.appendChild(card(x,i)));state.total=data.total!=null||data.total_count!=null?Number(data.total??data.total_count):data.has_more?Math.max(state.total||0,state.offset+data.items.length+1):state.offset+data.items.length;state.offset+=data.items.length;more.hidden=state.offset>=state.total||!data.items.length}catch(e){more.hidden=true;grid.innerHTML='<div class="empty"><strong>作品集暂时不可用</strong>请稍后重试。<button class="retry" type="button">重试</button></div>';grid.querySelector('.retry').onclick=()=>load(true);toast('作品加载失败，请稍后重试')}finally{state.loading=false}}
  async function like(article,id,item){const btn=article.querySelector('[data-like]'),count=btn.querySelector('span'),was=!!item.liked;item.liked=!was;const n=Math.max(0,Number(item.like_count??item.likes??0)+(was?-1:1));item.like_count=n;btn.classList.toggle('liked',item.liked);count.textContent=n.toLocaleString();btn.disabled=true;try{const data=await request(`${API}/${encodeURIComponent(String(id))}/like`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({liked:item.liked})});const result=data?.data||data||{};if(result.like_count!=null||result.likes!=null){item.like_count=Number(result.like_count??result.likes);count.textContent=item.like_count.toLocaleString()}if(result.liked!=null){item.liked=!!result.liked;btn.classList.toggle('liked',item.liked)}}catch(e){item.liked=was;item.like_count=Math.max(0,n+(was?1:-1));btn.classList.toggle('liked',was);count.textContent=item.like_count.toLocaleString();toast(e.message||'点赞失败')}finally{btn.disabled=false}}
  async function openDetail(item){const rawId=String(item.public_id||item.id||'');const d=$('#dialog');$('#detailTitle').textContent=item.title||'无题作品';const a=item.author||{};$('#detailBy').textContent=`by ${a.display_name||a.displayName||a.username||item.author_name||'匿名创作者'} · ${rating(item.rating)}`;$('#detailImage').src=imageUrl(item,false);$('#detailPrompt').textContent='正在读取公开信息…';$('#detailParams').innerHTML='<span class="hidden">正在读取…</span>';d.showModal();request(`${API}/${encodeURIComponent(rawId)}/view`,{method:'POST'}).catch(()=>{});try{const data=await request(`${API}/${encodeURIComponent(rawId)}`),x=data?.data||data;$('#detailTitle').textContent=x.title||item.title||'无题作品';const disclosed=x.prompt_disclosed!==false;$('#detailPrompt').textContent=disclosed?(x.prompt||x.public_prompt||'作者未公开 Prompt'):'作者未公开 Prompt';let p=x.parameters||x.params;if(typeof p==='string'){try{p=JSON.parse(p)}catch{p=null}}if(x.parameters_disclosed===false||x.params_disclosed===false||!p||typeof p!=='object'){$('#detailParams').innerHTML='<span class="hidden">作者未公开生成参数</span>'}else{$('#detailParams').innerHTML=Object.entries(p).filter(([,v])=>v!==null&&v!==undefined&&v!=='').map(([k,v])=>`<div class="param"><small>${esc(k)}</small><b>${esc(Array.isArray(v)?v.join(', '):v)}</b></div>`).join('')||'<span class="hidden">未提供参数</span>'}}catch(e){$('#detailPrompt').textContent='详情读取失败';$('#detailParams').innerHTML='<span class="hidden">'+esc(e.message)+'</span>'}}
  $('#close').onclick=()=>$('#dialog').close();$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog'))$('#dialog').close()});more.onclick=()=>load(false);document.querySelectorAll('#ratings button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#ratings button').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.rating=b.dataset.rating;load(true)});['hot','new'].forEach(k=>$('#'+k).onclick=()=>{state.sort=k;$('#hot').classList.toggle('active',k==='hot');$('#new').classList.toggle('active',k==='new');load(true)});let timer;$('#search').oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>{state.search=e.target.value.trim();load(true)},350)};load(true);
})();
</script>
</body></html>
